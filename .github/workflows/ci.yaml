name: ci-golang-workflow
on:
  pull_request:
    branches:
      - dev
      - master
jobs:
  check-application:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: [ '1.14', '1.13' ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        name: Setup go version ${{ matrix.go }}
        with:
          go-version: ${{ matrix.go }}
      - run: go test
      - run: go run math.go
